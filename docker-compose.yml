x-airflow-common:
  &airflow-common

  build:
    context: .
    dockerfile: Dockerfile

  image: ${AIRFLOW_IMAGE_NAME}

  env_file:
    - .env

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/files:/opt/airflow/files
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16
    container_name: postgres

    env_file:
      - .env

    ports:
      - "5436:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - lake

    restart: always


  airflow-init:
    <<: *airflow-common

    container_name: airflow-init

    command:
      - bash
      - -c
      - |
        python -m airflow db migrate
        python -m airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@local || true

    networks:
      - lake

    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy


  airflow-api-server:
    <<: *airflow-common

    command:
      - api-server

    container_name: airflow-api-server

    networks:
      - lake

    ports:
      - "8081:8080"

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common

    command:
      - scheduler

    container_name: airflow-scheduler

    networks:
      - lake

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  airflow-dag-processor:
    <<: *airflow-common

    command:
      - dag-processor

    container_name: airflow-dag-processor

    networks:
      - lake

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  minio:
    # DİQQƏT: bu, adi (pulsuz) MinIO Community Edition image-idir.
    # quay.io/minio/aistor/... image-i kommersiya lisenziyası tələb edir
    # və "License has fully expired" xətası verir — ona görə bu image istifadə olunur.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z

    container_name: minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    env_file:
      - .env

    ports:
      - "9002:9000"
      - "9003:9001"

    volumes:
      - minio:/data

    networks:
      - lake

    restart: always


volumes:
  minio:
  pgdata:


networks:
  lake:
    driver: bridge